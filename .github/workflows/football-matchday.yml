# 足球比赛日定时闭环：每天 12:07 UTC（北京时间 20:07）
#   1. 录前一天欧冠赛果（UEFA 官方）     2. 抓当天欧冠赛程并出候选预测（开赛前写入，开赛即锁定）
#   3. 8 道机械门禁 → 发布页 + 发布锚点  4. 开 PR（带 bot-authored 标签）交人工审
# 台账无变化（当天没有欧冠、前一天也没有）就什么都不做。
# 台账是哈希链，只能串行追加：若上一个比赛日 PR 还没合并，就接在它的分支上继续追加、更新同一个 PR（滚动 PR），
# 不会出现两个 PR 同时追加导致冲突，也保证前一天的预测能被录上赛果。
# 例行数据通道：只改台账/快照/发布页、门禁测试全过、且对照 main 证明台账只追加不改写时自动 squash 合并（见 config/trust.json 的 routineData）；
# 否则 PR 留待人工 review。紧急关闭：仓库变量 ROUTINE_AUTO_MERGE=false。
#
# 需要的仓库设置：Settings → Actions → General → Workflow permissions 勾选
#   "Allow GitHub Actions to create and approve pull requests"。
# 用默认 GITHUB_TOKEN 开的 PR 不会触发其他工作流（GitHub 的限制）；本工作流已在开 PR 前跑过门禁与测试。
# 如需 PR 自动跑 verify-and-merge，配置仓库 Secret BOT_PAT（有 repo 权限的个人令牌）即可。
#
# 竞彩（jczq）不在这里跑：竞彩官方接口在海外 CI 不可达，仍需在本地执行 jczq-board --live + jczq.mjs。
name: 足球比赛日闭环

on:
  schedule:
    - cron: '7 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '比赛日（YYYY-MM-DD，UTC）；默认今天'
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: football-matchday
  cancel-in-progress: false

jobs:
  matchday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 接上未合并的比赛日 PR（滚动 PR）
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("bot/football-matchday"))][0].headRefName // empty')
          if [ -n "$OPEN" ]; then
            git fetch origin "$OPEN"
            git checkout -B "$OPEN" "origin/$OPEN"
            echo "接在未合并的 $OPEN 上继续"
          fi
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"

      - name: 日期
        id: d
        run: |
          TODAY="${{ github.event.inputs.date }}"
          [ -z "$TODAY" ] && TODAY=$(date -u +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(date -u -d "$TODAY -1 day" +%F)" >> "$GITHUB_OUTPUT"

      - name: 录前一天欧冠赛果
        run: node football/bin/ucl-results.mjs --date ${{ steps.d.outputs.yesterday }}

      - name: 抓当天欧冠赛程并出候选预测
        run: |
          node football/bin/ucl.mjs --fetch --date ${{ steps.d.outputs.today }}
          node football/bin/ucl.mjs --date ${{ steps.d.outputs.today }} --skip-missing

      - name: 台账有变化吗
        id: changed
        run: |
          if [ -n "$(git status --porcelain football/ledger football/fixtures)" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "台账无变化，结束。"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 门禁、测试、发布
        if: steps.changed.outputs.yes == 'true'
        run: |
          node football/bin/gates.mjs
          (cd demo && npm test)
          (cd football && npm test)
          node football/bin/publish.mjs

      - name: 开 PR 交人工审
        if: steps.changed.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OPEN="${{ steps.base.outputs.open }}"
          BRANCH="${OPEN:-bot/football-matchday-${{ steps.d.outputs.today }}-${{ github.run_id }}}"
          [ -z "$OPEN" ] && git checkout -b "$BRANCH"
          git add football/ledger football/fixtures football/reports
          git commit -m "chore(football): ${{ steps.d.outputs.today }} 比赛日闭环（赛果录入 / 候选预测 / 发布）"
          git push origin "$BRANCH"
          if [ -n "$OPEN" ]; then
            gh pr comment "$OPEN" --body "已追加 ${{ steps.d.outputs.today }} 比赛日：录入 ${{ steps.d.outputs.yesterday }} 赛果、写入当天候选预测，门禁通过。" || true
            exit 0
          fi
          BODY="自动比赛日闭环：录入 ${{ steps.d.outputs.yesterday }} 欧冠赛果、写入 ${{ steps.d.outputs.today }} 欧冠候选预测（开赛前已推送，推送时间即赛前证据）、8 道门禁通过后更新发布页与发布锚点。

          满足例行数据条件（只追加、不改写 main 上已发布的台账）时会自动合并并重新部署发布页；否则留待人工 review。"
          gh pr create --base main --head "$BRANCH" --title "chore(football): ${{ steps.d.outputs.today }} 比赛日闭环" --body "$BODY" --label bot-authored \
            || gh pr create --base main --head "$BRANCH" --title "chore(football): ${{ steps.d.outputs.today }} 比赛日闭环" --body "$BODY"

      # 例行数据通道（只追加的数据 PR 自动合并；代码/工作流/规则改动永远走人工 review）。
      # 检查脚本必须取 main 上的版本运行，PR 改不了它。紧急关闭：仓库变量 ROUTINE_AUTO_MERGE=false。
      - name: 例行数据自动合并
        if: steps.changed.outputs.yes == 'true' && vars.ROUTINE_AUTO_MERGE != 'false'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
        run: |
          git fetch origin main
          git show origin/main:scripts/routine-merge-check.mjs > "$RUNNER_TEMP/routine-merge-check.mjs" 2>/dev/null || rm -f "$RUNNER_TEMP/routine-merge-check.mjs"
          if [ -s "$RUNNER_TEMP/routine-merge-check.mjs" ] && node "$RUNNER_TEMP/routine-merge-check.mjs" --base origin/main; then
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            gh pr merge "$BRANCH" --squash --delete-branch
            # 默认令牌推到 main 不会触发其他工作流，这里显式触发发布页重新部署
            gh workflow run football-pages.yml --ref main
          else
            echo "不满足例行数据自动合并条件，PR 留待人工 review。"
          fi
