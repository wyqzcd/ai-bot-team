# 校验 + 混合信任评分 + 渐进自动合并
# 依赖 Secrets：ANTHROPIC_API_KEY（可选，QA Agent 用）
# 依赖 Variables：QA_AGENT_ENABLED（"true" 才在 CI 跑 pstack QA Agent）、AUTO_MERGE（"true" 才允许真实合并）
name: 校验与渐进自动合并

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 接入真实项目时，把这里换成你项目的检查命令（测试/构建/lint）
      - name: 安装依赖并测试（demo）
        id: tests
        working-directory: demo
        continue-on-error: true
        run: |
          npm install
          npm test

      # 可选：pstack QA Agent 做真实行为验证，把报告写进 config/verification/
      # 国内用户：配 Secrets.ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN（DeepSeek 等 Anthropic 兼容端点）
      # 注意：secrets 不能出现在 if 条件里，凭据缺失在 shell 里判断
      - name: QA Agent 验证（pstack，可选）
        id: qa
        if: ${{ vars.QA_AGENT_ENABLED == 'true' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "未配置模型凭据，跳过 QA Agent（评分将按未验证处理）。"
            exit 0
          fi
          if [ -n "$AGENT_MODEL" ]; then export ANTHROPIC_MODEL="$AGENT_MODEL"; fi
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add cursor/plugins || true
          claude plugin install pstack@cursor-plugins || true
          claude -p "你是 QA 验证 Agent。按 prove-it-works 纪律验证当前 PR 的改动：跑项目真实检查命令、逐条核对验收标准、构造反例实际运行复现。把验证报告写成 config/verification/pr-${{ github.event.pull_request.number }}.json（结构参考 .claude/agents/qa.md）。只报告实际复现的问题。" \
            --dangerously-skip-permissions \
            --allowedTools "Bash" "Read" "Grep" "Glob" "Write"

      # 安全：放权配置只信任 base 分支，防止 PR 自己改 trust.json 提权
      - name: 取 base 分支放权配置
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE" --depth=1
          git show "origin/$BASE:config/trust.json" > trust-base.json
          echo "已从 $BASE 读取放权配置"

      - name: 计算信任评分并评论
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFIED=${{ steps.qa.outcome == 'success' && 'true' || 'false' }}
          node scripts/trust-score.mjs score-pr ${{ github.event.pull_request.number }} \
            --config trust-base.json \
            --ci ${{ steps.tests.outcome }} \
            --verified "$VERIFIED" \
            --format markdown > score-comment.md
          node scripts/trust-score.mjs score-pr ${{ github.event.pull_request.number }} \
            --config trust-base.json \
            --ci ${{ steps.tests.outcome }} \
            --verified "$VERIFIED" > result.json
          gh pr comment ${{ github.event.pull_request.number }} --body-file score-comment.md || true

      - name: 上传评分结果
        uses: actions/upload-artifact@v4
        with:
          name: trust-score-result
          path: result.json

  merge:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: trust-score-result

      # 同 verify：只信任 base 分支配置，避免 PR 提权
      - name: 取 base 分支放权配置
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE" --depth=1
          git show "origin/$BASE:config/trust.json" > trust-base.json

      - name: 决策并执行
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.pull_request.number }}
          DECISION=$(jq -r .decision result.json)
          BOT_AUTHORED=$(jq -r .botAuthored result.json)
          OWNER=$(jq -r .owner trust-base.json)
          echo "决策：$DECISION（bot PR：$BOT_AUTHORED）"

          if [ "$BOT_AUTHORED" != "true" ]; then
            echo "非 bot PR，跳过自动合并（只允许带 bot-authored 标签的 PR 走自动通道）。"
            exit 0
          fi

          if [ "$DECISION" = "auto_merge" ] && [ "${{ vars.AUTO_MERGE }}" = "true" ]; then
            echo "执行自动合并…"
            gh pr merge "$PR" --squash --delete-branch
          elif [ "$DECISION" = "auto_merge" ]; then
            echo "评分达标，但仓库变量 AUTO_MERGE 未开启，转人工。"
            gh pr comment "$PR" --body "评分已达标，但 AUTO_MERGE 仓库变量未开启，请人工合并。"
            gh pr edit "$PR" --add-reviewer "$OWNER" || true
          else
            echo "评分未达标，指派人工 review：$OWNER"
            gh pr edit "$PR" --add-reviewer "$OWNER" || true
          fi
