# 足球台账发布页上线（GitHub Pages）
# 只在 main 上、且 8 道机械门禁全部通过时部署；门禁不过 = 不上线。
# 首次使用需在仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
name: 足球发布页上线

on:
  push:
    branches: [main]
    paths: ['football/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: football-pages
  cancel-in-progress: false

jobs:
  # 打包与部署拆成两个任务（GitHub 官方模板做法）：deploy-pages 紧接着上传去查产物时，
  # 偶发 "Found 0 artifact(s)"（产物列表尚未同步）。拆开后部署在打包任务结束后才开始，并在失败时等待后重试一次。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 8 道机械门禁（真实时间）
        run: node football/bin/gates.mjs

      # 只部署仓库里已提交的发布页（由 publish.mjs 生成、与 published.json 锚点同批提交），不在 CI 里重新生成
      - name: 组装站点
        run: |
          mkdir -p _site
          cp football/reports/*.html _site/
          LATEST=$(ls football/reports/*.html | sort | tail -1)
          cp "$LATEST" _site/index.html
          echo "首页 = $LATEST"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 首次部署失败，等待后重试
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
